name: LaunchGate 360 CI

on:
  push:
    branches: [main]
    paths:
      - "launchgate-360/**"
      - ".github/workflows/launchgate-360-ci.yml"
  pull_request:
    paths:
      - "launchgate-360/**"
      - ".github/workflows/launchgate-360-ci.yml"

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: launchgate-360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: launchgate-360/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Production build (DEMO mode)
        run: npm run build
        env:
          LAUNCHGATE_DEMO_MODE: "true"
